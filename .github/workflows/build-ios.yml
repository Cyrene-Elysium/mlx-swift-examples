name: Build MLX iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Version
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build Unsigned App
        run: |
          xcodebuild clean build \
            -project Applications/MLXChatExample/MLXChatExample.xcodeproj \
            -scheme MLXChatExample \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MLXChatDerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          rm -rf build
          mkdir -p build/Payload

          cp -R \
            "$RUNNER_TEMP/MLXChatDerivedData/Build/Products/Release-iphoneos/MLXChatExample.app" \
            build/Payload/

          cd build
          zip -r MLXChatExample.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLXChatExample-IPA
          path: build/MLXChatExample.ipa
        with:
          name: LLMEval-IPA
          path: LLMEval.ipa

