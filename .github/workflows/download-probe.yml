name: Download Probe

on:
  workflow_dispatch:
  push:
    branches: [probe/download-stall]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve probe package
        run: |
          cd probe
          swift package resolve

      - name: Run download probe (Qwen3-4B-4bit snapshot)
        run: |
          cd probe
          swift run -c release probe 2>&1 | tee probe-output.log

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: probe/probe-output.log
          if-no-files-found: warn
